# HAProxy — единственная точка входа FLT (ADR-012). Один файл для docker-compose (bind mount)
# и Helm (ConfigMap). Различия стендов — только переменными окружения:
#   API_HOST        — DNS-имя инстансов роли api (compose: api; Kubernetes: headless Service flt-api)
#   FRONTEND_HOST   — Nginx со статикой (Г.8); не задан — остальные пути отвечают заглушкой 404
#   MINIO_HOST      — хранилище файлов по /flt-* (ADR-007, Г.8)
#   LIVEKIT_HOST    — сигнализация LiveKit по /livekit/* (этап 6, ADR-015)
#   FLT_TLS_DOMAIN  — домен с TLS (prod); не задан — без TLS на :80 и :8080 (local, dev, CI)
#   FLT_EXPOSE_DOCS — открыть /api/docs и не снимать X-Instance-Id (local, dev, стенд CI; SYS-05-R5)
# Проверка: haproxy -c -f haproxy.cfg (обе ветки — с FLT_TLS_DOMAIN и без).

global
    log stdout format raw local0 info
    maxconn 4096
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256

# Обнаружение инстансов через DNS: compose — встроенный DNS Docker (127.0.0.11), Kubernetes — kube-dns.
resolvers platform
    parse-resolv-conf
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid      10s
    hold obsolete   30s

defaults
    log     global
    mode    http
    option  dontlognull
    option  redispatch
    retries 2
    timeout connect      5s
    timeout client       30s
    timeout server       60s
    timeout http-request 10s
    timeout http-keep-alive 10s
    timeout queue        10s
    # Проверка /v1/ready отвечает за миллисекунды (кэш 5 с, ADR-010): 1 с на чтение ответа.
    timeout check        1s
    timeout tunnel       1h
    timeout client-fin   30s
    # JSON-лог с request_id (ADR-010, ADR-012 §3.7); заменяет option httplog.
    log-format '{"@timestamp":"%Tl","request_id":"%ID","client_ip":"%ci","method":"%HM","path":"%HPO","status":%ST,"backend":"%b","server":"%s","duration_ms":%Ta,"bytes":%B,"termination":"%ts"}'

.if defined(FLT_TLS_DOMAIN)
# prod: :80 — только ACME HTTP-01 и редирект на HTTPS (ADR-012 §3.3).
frontend fe_http
    bind :80
    http-request return status 200 content-type text/plain string ok if { path /healthz }
    acl acme path_beg /.well-known/acme-challenge/
    http-request redirect scheme https code 301 unless acme
    use_backend be_frontend if acme

frontend fe_https
    bind :443 ssl crt /etc/haproxy/certs/ alpn h2,http/1.1
    http-request set-header X-Forwarded-Proto https
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains"
.else
# local, dev, CI: без TLS на :80 и :8080 (стенд N3 публикует :8080 — SYS-05-R44).
frontend fe_plain
    bind :80
    bind :8080
    http-request set-header X-Forwarded-Proto http
.endif
    # --- общая часть fe_https / fe_plain ---
    http-request return status 200 content-type text/plain string ok if { path /healthz }

    # X-Request-ID генерирует HAProxy, клиентский перезаписывается (ADR-010, SYS-03-R20).
    unique-id-format %[uuid()]
    unique-id-header X-Request-ID
    http-request set-header X-Request-ID %[unique-id]
    http-response set-header X-Request-ID %[unique-id]
    # Доверенный IP клиента для монолита (proxy_headers, FORWARDED_ALLOW_IPS — ADR-012 §3.4).
    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Real-IP %[src]
    http-request del-header Proxy

    http-response set-header X-Content-Type-Options nosniff
    http-response set-header Referrer-Policy strict-origin-when-cross-origin
    http-response set-header X-Frame-Options DENY
    http-response set-header Permissions-Policy "camera=(self), microphone=(self), geolocation=()"

    # Документация API снаружи закрыта; служебные /v1/* лежат вне /api и /ws и до монолита не доходят.
    acl docs_paths path_beg /api/docs /api/redoc /api/openapi.json
    .if !defined(FLT_EXPOSE_DOCS)
    http-request deny deny_status 404 if docs_paths
    # Идентификатор инстанса клиентам на prod не нужен (SYS-05-R5).
    http-response del-header X-Instance-Id
    .endif

    # Размер тела REST — до 25 МБ (файлы идут в хранилище по presigned URL, ADR-007).
    http-request deny deny_status 413 if { path_beg /api/ } { req.hdr_val(content-length) gt 26214400 }

    .if defined(MINIO_HOST)
    acl is_s3            path_beg /flt-
    acl s3_method_ok     method GET HEAD PUT POST
    acl s3_bucket_level  path_reg ^/flt-[a-z0-9-]+/?$
    http-request deny deny_status 405 if is_s3 !s3_method_ok
    http-request deny deny_status 403 if is_s3 s3_bucket_level !METH_POST
    .endif

    # Первый рубеж лимитов по IP; глобальные лимиты — в Redis (SYS-05-R51).
    stick-table type ipv6 size 100k expire 10m store http_req_rate(10s)
    acl auth_paths path_beg /api/v1/auth/
    acl quick_test_paths path_beg /api/v1/assessment/quick-test
    http-request track-sc0 src if auth_paths || quick_test_paths
    http-request deny deny_status 429 if auth_paths { sc_http_req_rate(0) gt 20 }
    http-request deny deny_status 429 if quick_test_paths { sc_http_req_rate(0) gt 30 }

    compression algo gzip
    compression type application/json text/plain

    use_backend be_api_ws if { path_beg /ws/ } || { path /ws }
    use_backend be_api    if { path_beg /api/ }
    .if defined(LIVEKIT_HOST)
    use_backend be_livekit if { path_beg /livekit/ }
    .endif
    .if defined(MINIO_HOST)
    use_backend be_minio if is_s3
    .endif
    default_backend be_frontend

# Инстансы роли api: round-robin без sticky-сессий, исключение по /v1/ready (ADR-012 §3.5).
# server-template резервирует 10 слотов; адреса приходят из DNS (--scale api=N, HPA) без перезагрузки,
# незанятые слоты — в состоянии MAINT. init-addr none: слоты заполняет только resolver.
backend be_api
    balance roundrobin
    option httpchk GET /v1/ready
    http-check expect status 200
    # После первой неудачи проверки идут чаще (fastinter): остановленный инстанс, чей адрес пропал
    # (соединение проверки ждёт min(timeout connect, inter) = 2 с), снимается за ≤ 10 с (SYS-05-R41).
    default-server inter 2s fastinter 500ms fall 3 rise 2 resolvers platform init-addr none maxconn 1000
    # Путь не переписывается: монолит обслуживает /api/v1/<module>/... сам (ADR-004).
    server-template api 1-10 "${API_HOST}":8000 check

backend be_api_ws
    balance roundrobin
    option httpchk GET /v1/ready
    http-check expect status 200
    timeout server 1h
    default-server inter 2s fastinter 500ms fall 3 rise 2 resolvers platform init-addr none maxconn 1000
    server-template api 1-10 "${API_HOST}":8000 check

.if defined(FRONTEND_HOST)
backend be_frontend
    balance roundrobin
    option httpchk GET /healthz
    default-server inter 5s fall 3 rise 2 resolvers platform init-addr none
    server-template web 1-3 "${FRONTEND_HOST}":8080 check
.else
# Nginx со статикой появляется в Г.8; до этого остальные пути получают 404.
backend be_frontend
    http-request return status 404 content-type text/plain string "not found"
.endif

.if defined(MINIO_HOST)
backend be_minio
    # Путь и Host не меняются — подпись SigV4 presigned URL остаётся валидной (ADR-007).
    http-response set-header X-Content-Type-Options nosniff
    http-response set-header Content-Security-Policy "default-src 'none'; sandbox"
    timeout server 600s
    server minio1 "${MINIO_HOST}":9000 check resolvers platform init-addr none
.endif

.if defined(LIVEKIT_HOST)
backend be_livekit
    # Единственный маршрут со снятием префикса (ADR-015); /livekit/twirp/* снаружи запрещён.
    http-request deny deny_status 403 if { path_beg /livekit/twirp/ }
    http-request replace-path /livekit(/.*) \1
    timeout tunnel 1h
    server livekit1 "${LIVEKIT_HOST}":7880 check resolvers platform init-addr none
.endif

# Stats и метрики Prometheus — только во внутренней сети (порт 8404 не публикуется).
listen stats
    bind :8404
    stats enable
    stats uri /stats
    stats refresh 10s
    # Адреса серверов в stats;csv (поле addr): тесты стенда N3 сопоставляют сервер с контейнером.
    stats show-legends
    http-request use-service prometheus-exporter if { path /metrics }

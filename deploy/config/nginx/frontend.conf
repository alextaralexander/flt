# Nginx образа flt-frontend (ADR-005, 3.8; ADR-012; SYS-02-R17; SYS-11).
# Только статика сборки, SPA fallback, CSP, /healthz и webroot ACME.
# /api, /ws и /flt-* сюда не приходят: их маршрутизирует HAProxy (ADR-012).
# Один и тот же файл копируется в образ и используется в docker-compose и Helm.
# Образ nginxinc/nginx-unprivileged: порт 8080, временные файлы в /tmp
# (контейнер работает с read_only rootfs и tmpfs /tmp, SYS-11).

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

    # add_header наследуется только если в location нет своих add_header,
    # поэтому заголовки безопасности повторяются в каждом location.

    # Ассеты Vite с хэшем в имени: кэш на год
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    # HTML-документ приложения: без кэша, с CSP (SYS-02-R17; HSTS,
    # X-Frame-Options, Permissions-Policy выставляет HAProxy, ADR-012)
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Проверка живости контейнера (healthcheck compose, probes Helm)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Webroot certbot для HTTP-01 (ADR-012, 3.3): том acme-webroot, только чтение
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    # SPA fallback: маршруты приложения отдаёт index.html (с CSP выше)
    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri $uri/ /index.html;
    }
}

# FLT — локальное окружение на docker-compose.
#
# Сейчас здесь бэкенд (Python-монолит) и инфраструктура, которая нужна ему для запуска.
# Остальные контейнеры из CLAUDE.md («Состав контейнеров») добавляются на этапе 1.
#
# Запуск из корня репозитория:
#   docker compose -f deploy/docker-compose/docker-compose.yml up -d --build
# Только инфраструктура (для запуска бэкенда на хосте через `make dev`):
#   make compose-up        # из src/backend/py-monolyth

name: flt

services:
  postgres:
    image: postgres:18-alpine
    environment:
      # Значения совпадают со стендом local бэкенда (envs/local/local.env) — только для локальной разработки.
      POSTGRES_USER: ms_py_test
      POSTGRES_PASSWORD: ms_py_test
      POSTGRES_DB: flt
    ports:
      - "5432:5432"
    volumes:
      # Образы postgres 18+ хранят данные в подкаталоге /var/lib/postgresql/<версия>.
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ms_py_test -d flt"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:4.1.0
    environment:
      # Один узел в режиме KRaft (без ZooKeeper).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL — для контейнеров (kafka:29092), EXTERNAL — для процессов на хосте (localhost:9092).
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: ../../src/backend/py-monolyth
      dockerfile: Dockerfile
      additional_contexts:
        py-main-lib: ../../src/backend/py-main-lib
    image: flt-backend:local
    environment:
      # Стенд local + адреса сервисов внутри сети compose (переменные окружения важнее env-файлов стенда).
      STAND_NAME: local
      FAST_API_HOST: 0.0.0.0
      PG_HOST: postgres
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  postgres-data:

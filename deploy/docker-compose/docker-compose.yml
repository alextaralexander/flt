# FLT — локальное окружение на docker-compose.
#
# Сейчас здесь бэкенд (Python-монолит) и инфраструктура, которая нужна ему для запуска.
# Остальные контейнеры из CLAUDE.md («Состав контейнеров») добавляются на этапе 1.
#
# Запуск из корня репозитория:
#   docker compose -f deploy/docker-compose/docker-compose.yml up -d --build
# Только инфраструктура (для запуска бэкенда на хосте через `make dev`; порты на loopback хоста
# публикует оверлей docker-compose.local-ports.yml — SYS-11-R13):
#   make compose-up        # из src/backend/py-monolyth
# Стенд из N = 3 инстансов за HAProxy (SYS-05-R44) — оверлей docker-compose.ci.yml:
#   make test-n3           # из src/backend/py-monolyth

name: flt

services:
  postgres:
    image: postgres:18-alpine
    environment:
      # Роль flt и пароль стенда local (envs/local/local.env) — фиксированное тестовое значение
      # локальной машины (ADR-013); стенд N3 переопределяет пароль в docker-compose.ci.yml.
      POSTGRES_USER: flt
      POSTGRES_PASSWORD: ${PG_PASSWORD:-flt_local} # pragma: allowlist secret
      POSTGRES_DB: flt
    volumes:
      # Образы postgres 18+ хранят данные в подкаталоге /var/lib/postgresql/<версия>.
      - postgres-data:/var/lib/postgresql
      # 01-create-test-db.sql создаёт базу pytest flt_test (SYS-10-R4).
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flt -d flt"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # S3-хранилище файлов (ADR-007). Официальный образ minio/minio больше не публикуется; на этапе 1 —
  # зафиксированный образ, сервер для prod — OQ-64. Порт 9000 — только loopback (снаружи — HAProxy, Г.8).
  minio:
    image: bitnamilegacy/minio:2025.7.23
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-flt_local_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-flt_local_minio_secret} # pragma: allowlist secret
      MINIO_BROWSER: "off"
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:4.1.0
    environment:
      # Один узел в режиме KRaft (без ZooKeeper).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL — для контейнеров (kafka:29092), EXTERNAL — для процессов на хосте (localhost:9092).
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: ../../src/backend/py-monolyth
      dockerfile: Dockerfile
      additional_contexts:
        py-main-lib: ../../src/backend/py-main-lib
    image: flt-backend:local
    environment:
      # Стенд local + адреса сервисов внутри сети compose (переменные окружения важнее env-файлов стенда).
      STAND_NAME: local
      FAST_API_HOST: 0.0.0.0
      PG_HOST: postgres
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:

# Конфигурация markdownlint-cli2 для документации репозитория (SYS-12-R8, ADR-011).
# Проверяются Analytics/**/*.md, CLAUDE.md и README.md: pre-commit hook
# markdownlint-cli2 (.pre-commit-config.yaml) и job docs в .github/workflows/ci.yml.
# Включены все правила markdownlint по умолчанию; ниже отключены или настроены только те,
# которые противоречат принятому стилю документов проекта (причина — в комментарии).
config:
  default: true

  # Длина строки: абзац документа пишется одной строкой без ручных переносов
  # (так устроены все ADR, SYS, ТЗ и CLAUDE.md; переносы ломают diff по смыслу) — SYS-12-R8.
  MD013: false

  # Стиль столбцов таблиц: в проекте таблицы пишутся компактно (`|---|---|`, без выравнивающих
  # пробелов); выравнивание длинных русских ячеек сделало бы таблицы нечитаемыми в diff.
  MD060: false

  # Пустые строки вокруг списков: в документах список часто идёт сразу за вводной строкой
  # абзаца («Правила:» и следом «- …»); это принятый стиль, на рендер GitHub не влияет.
  MD032: false

  # Нумерация упорядоченных списков: продолжение нумерации после вставки (пункты 4–6, 9–10
  # после блока текста) несёт смысл — номера пунктов упоминаются в ссылках из других документов.
  MD029: false

  # Голые URL: в CLAUDE.md и README адрес репозитория приводится как есть, GitHub делает его
  # ссылкой автоматически.
  MD034: false

  # Пробелы внутри code span: в SYS-10 регулярные выражения приводятся буквально, значимый
  # пробел в конце выражения — часть примера.
  MD038: false

  # Пустые строки вокруг блоков кода (SYS-12-R8: правило включено) — кроме блоков внутри
  # пунктов списка: в проекте блок кода в пункте списка идёт сразу за строкой-пояснением.
  MD031:
    list_items: false

  # Повтор заголовков: одинаковые подзаголовки допустимы в разных разделах
  # (например, «Отличия проекта от boilerplate» у backend и frontend в CLAUDE.md) — SYS-12-R8.
  MD024:
    siblings_only: true

  # Inline HTML: запрещён в заполненных документах; в шаблонах (Analytics/Specs/_templates/)
  # плейсхолдеры вида <presigned URL> и HTML-комментарии с инструкциями разрешены — SYS-12-R8.
  # Исключение задаётся в Analytics/Specs/_templates/.markdownlint-cli2.yaml.
  MD033: true

# Каталоги зависимостей и сгенерированных артефактов не проверяются.
ignores:
  - "**/node_modules/**"
  - "**/.venv/**"

# Alembic: секция на модуль, общий env.py, своя схема и таблица alembic_version у каждого модуля
# (ADR-002, раздел 3.4). Запуск — только с секцией модуля:
#   uv run alembic -n <module> upgrade head          # make migrate — по всем модулям реестра
#   uv run alembic -n <module> revision --autogenerate -m "add_x"   # make makemigration module=<module> name=add_x
# Секции модулей дописывает скаффолдер (`make scaffold-module name=<module>`).
# Адрес БД берётся из настроек стенда (configs/settings.py), здесь учётных данных нет (ADR-013).

[alembic]
# Секция по умолчанию: env.py завершится с ошибкой «укажите модуль».
script_location = app/core/dao/db_helpers/migrations
prepend_sys_path = .
path_separator = os

# --- Модули (генерирует `python -m cli add-module`) ---

[project]
name = "flt-backend"
version = "0.1.0"
description = "FLT backend: modular monolith on FastAPI, Kafka (FastStream), PostgreSQL, Redis."
requires-python = ">=3.14"
# Диапазоны вместо жёстких пинов: точные версии фиксирует uv.lock,
# обновление — `uv lock --upgrade` (или Renovate) + прогон `make check`.
dependencies = [
    # Core
    "fastapi>=0.115,<1.0",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "fast-depends>=3,<4",
    # ASGI server (uvloop/httptools/websockets/watchfiles тянутся через [standard])
    "uvicorn[standard]>=0.34,<1",
    # Database ([asyncio] гарантирует greenlet на всех платформах, включая macOS arm64)
    "SQLAlchemy[asyncio]>=2.0.29,<2.1",
    "sqlalchemy-searchable>=2.1,<3",
    "SQLAlchemy-Utils>=0.41,<1",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    # Brokers (FastStream + Kafka). Линия 0.7 (мигрировано 2026-07);
    # потолок <0.8 — следующую major-линию брать осознанно вместе с py-main-lib.
    "faststream>=0.7,<0.8",
    "aiokafka>=0.12,<1",
    # Cache
    "redis>=5.2,<7",
    # Security
    "python-multipart>=0.0.20",
    "PyJWT>=2.10,<3",
    "cryptography>=44",
    # HTTP client
    "httpx>=0.28,<1",
    # SMTP-клиент shared kernel `MailClient` (OQ-11)
    "aiosmtplib>=4,<6",
    # Metrics, tracing, monitoring
    "prometheus-client>=0.21,<1",
    # Клиент поиска shared kernel (ADR-014, этап 1 Г.4); логи в OpenSearch доставляет Fluent Bit (ADR-010).
    "opensearch-py>=3.1,<4",
    "opentelemetry-api>=1.38,<2",
    "opentelemetry-sdk>=1.38,<2",
    "opentelemetry-exporter-otlp>=1.38,<2",
    "opentelemetry-instrumentation-fastapi>=0.59b0,<1",
    "opentelemetry-instrumentation-aiokafka>=0.59b0,<1",
    "opentelemetry-instrumentation-asyncpg>=0.59b0,<1",
    "opentelemetry-instrumentation-redis>=0.59b0,<1",
    "opentelemetry-instrumentation-requests>=0.59b0,<1",
    "opentelemetry-instrumentation-sqlalchemy>=0.59b0,<1",
    "opentelemetry-instrumentation-starlette>=0.59b0,<1",
    # Logging
    "structlog>=25.1",
    # Configuration & utils
    "python-dotenv>=1.0,<2",
    "PyYAML>=6,<7",
    "email-validator>=2.2,<3",
    "Jinja2>=3.1,<4",
    # CLI
    "typer>=0.16,<1",
    "fastapi-cli>=0.0.7,<1",
    # Внутренняя библиотека: path-зависимость uv (ADR-001, OQ-69), её зависимости учитывает uv.lock.
    "py-main-lib",
    "babel>=2.17,<3",
    "aioboto3>=15,<16",
    "argon2-cffi>=25,<26",
]

[dependency-groups]
dev = [
    # Линт + форматирование (один инструмент вместо black/isort/autoflake/flake8)
    "ruff>=0.9",
    "mypy>=1.17,<2",
    # Границы модулей (ADR-002): контракты в .importlinter, запуск — `make arch`
    "import-linter>=2.3,<3",
    "pre-commit>=4.1,<5",
    # Тесты
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<2",
    "pytest-cov>=6,<8",
    "pytest-dotenv>=0.5,<1",
    "pytest-env>=1.1,<2",
    "pytest-mock>=3.14,<4",
    "coverage>=7.6,<8",
    # Детерминизм (SYS-10-R37): запрет сети кроме loopback, случайный порядок с фиксированным seed
    "pytest-socket>=0.7,<1",
    "pytest-randomly>=3.16,<5",
    # Фабрики тестовых объектов (SYS-10-R16) и заглушки HTTP внешних сервисов (SYS-10-R20)
    "polyfactory>=2.18,<4",
    "respx>=0.22,<1",
    # Безопасность (G6)
    "bandit>=1.8,<2",
    "detect-secrets>=1.5,<2",
    # Стабы для типизации
    "types-PyYAML>=6",
]

[tool.uv]
# Это сервис, а не публикуемый пакет: uv только управляет окружением и lock-файлом.
package = false

[tool.uv.sources]
# py-main-lib правится в этом репозитории и ставится из соседней папки (в Docker — из build-context-а).
py-main-lib = { path = "../py-main-lib" }

[tool.bandit]
exclude_dirs = ["tests", ".venv", "app/core/dao/db_helpers/migrations"]
# B101 (assert) — допустимо вне продакшен-путей; остальное проверяется.
skips = ["B101"]

# --- Ruff: линт + сортировка импортов + форматирование -----------------------

[tool.ruff]
line-length = 120
target-version = "py314"
# Ревизии Alembic модулей генерирует autogenerate — их не форматируем и не линтим.
extend-exclude = ["app/modules/*/migrations/versions"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes (включая неиспользуемые импорты — бывший autoflake)
    "I",     # isort
    "UP",    # pyupgrade — современный синтаксис
    "B",     # bugbear — вероятные баги
    "C4",    # comprehensions
    "SIM",   # simplify
    "D",     # pydocstyle
    "ASYNC", # flake8-async — блокирующие вызовы в async-коде
    "RUF",   # ruff-specific правила (ClassVar, dangling tasks, unused noqa)
]
ignore = [
    # Docstring обязателен для каждого модуля, класса и функции (D1xx включены);
    # послабления только по форме: пустая строка после докстринга, точка в конце,
    # однострочность первой фразы.
    "D202", "D205", "D415",
    # Кириллица в докстрингах и комментариях — «неоднозначные» unicode-символы здесь норма.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.flake8-bugbear]
# Идиоматика FastAPI/FastStream: вызовы DI-маркеров в default-аргументах — норма.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Security",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.File",
    "fastapi.Form",
    "faststream.Context",
    # Собственные фабрики зависимостей проекта
    "app.core.security.security.auth_user",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
lines-after-imports = 2

# --- Mypy (strict) ------------------------------------------------------------

[tool.mypy]
plugins = ['pydantic.mypy']
python_version = "3.14"
exclude = ['.git', '__pycache__', 'migrations']
# strict включает разом disallow_untyped_defs/calls, disallow_any_generics,
# warn_return_any, warn_unused_ignores, no_implicit_reexport и остальной набор;
# точечные послабления — только через overrides ниже.
strict = true
warn_unreachable = true
extra_checks = true
# Базовые классы (BaseService/BaseDAO/BaseEntityModel/ResponseV1) приходят из
# py_main_lib без py.typed — наследование от них неизбежно наследует Any.
disallow_subclassing_any = false
# Контейнер зависимостей и точки расширения принимают `Protocol` как `type[T]`
# (`provide(IdentityService)`, ADR-004 §2.6, SYS-09-R1); mypy считает такой аргумент ошибкой.
disable_error_code = ["type-abstract"]

[[tool.mypy.overrides]]
# Внутренняя библиотека без py.typed-маркера — типы не раздаёт.
module = "py_main_lib.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# aiokafka не публикует стабы / py.typed.
module = ["aiokafka.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# aioboto3 и botocore без py.typed; импортируются только в app/core/storage (ADR-007).
module = ["aioboto3.*", "botocore.*"]
ignore_missing_imports = true

# --- Pytest / coverage ---------------------------------------------------------

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
# Pytest-оверлей поверх стенда local; envs/test/ — деплой-стенд, к pytest отношения не имеет.
env_files = ["envs/.test.env"]
# SYS-10-R12, R37: неизвестный маркер — ошибка; сокеты только к loopback (pytest-socket);
# случайный порядок с фиксированным seed (pytest-randomly; для поиска порядковых
# зависимостей seed переопределяется: `-p randomly --randomly-seed=<n>`).
addopts = "-v --strict-markers --durations=20 -p randomly --randomly-seed=20261010 --disable-socket --allow-hosts=127.0.0.1,::1,localhost"
# Один event loop на всю сессию: engine/клиенты создаются на уровне модулей
# и не переживают смену loop-а (раньше это делала кастомная фикстура event_loop).
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "ac(id): критерий приёмки ТЗ, например ac('STU-18-AC3') (SYS-10-R12)",
    "req(id): требование системной спецификации, например req('SYS-05-R12') (SYS-10-R12)",
    "n_instances: тест на стенде N3 (SYS-05-R45); пропускается без --stand-url",
    "smoke: смоук-набор «ходячего скелета» (SYS-10-R31)",
    "slow(reason): тест длиннее 5 с с обоснованием (SYS-10-R30)",
    "quarantine(issue, until): карантин нестабильного теста не дольше 14 дней (SYS-10-R29)",
    "no_db: тест не требует подключения к БД",
    "req(id): требование системной спецификации, например req('SYS-05-R12'); обязателен в tests/architecture (SYS-10)",
]
filterwarnings = [
    "ignore::pluggy.PluggyTeardownRaisedWarning",
]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
# Порог качества: текущее покрытие ~78%, гейт с запасом на инфраструктурные ветки.
fail_under = 75

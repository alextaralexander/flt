[project]
name = "py-main-lib"
version = "0.1.0"
description = "Внутренняя библиотека монолита FLT: базовые DAO/сервисы, фильтры, схемы ответов, проверка прав."
requires-python = ">=3.12"
# Диапазоны, совместимые с монолитом (src/backend/py-monolyth/pyproject.toml); точные версии
# фиксирует uv.lock монолита — библиотека подключается к нему как path-зависимость uv (ADR-001, OQ-69).
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.10,<3",
    "SQLAlchemy[asyncio]>=2.0.29,<2.1",
    "alembic>=1.14,<2",
    "redis>=5.2,<7",
    "PyJWT>=2.10,<3",
    "httpx>=0.28,<1",
    "typing-extensions>=4.12",
]

[project.optional-dependencies]
# Цветной консольный логгер (`py_main_lib.colored_logger`) — монолитом не используется.
colored-logger = ["colorlog>=6.9,<7"]
# Клиент внешнего сервиса прав (`py_main_lib.security.permission_service`) — монолитом не используется.
permission-service = ["requests>=2.32,<3"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["py_main_lib"]
# Фикстуры pytest библиотеки в колесо не попадают: монолиту они не нужны.
exclude = ["py_main_lib/tests"]

[tool.hatch.build.targets.sdist]
include = ["py_main_lib", "README.md"]

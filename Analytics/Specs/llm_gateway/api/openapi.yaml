openapi: 3.1.0
info:
  title: FLT llm_gateway API
  version: 1.0.0
  description: >-
    Контракт модуля llm_gateway целиком (SYS-08-R27). На этапе 1 (Г.6) реализуются operationId
    llm_gateway_listProviderKinds и llm_gateway_testProviderBinding; операции с x-flt-stage 4 реализуются
    в ТЗ STU-01, STU-03 и до этого отсутствуют в коде. Генерации по REST нет — стрим только по WebSocket (ADR-009).
servers:
  - url: /
tags:
  - name: llm_gateway
paths:
  /api/v1/llm-gateway/provider-kinds:
    get:
      operationId: llm_gateway_listProviderKinds
      tags: [llm_gateway]
      summary: Виды провайдеров, доступные стенду и роли
      security: [{}, { bearerAuth: [] }, { cookieAuth: [] }]
      x-flt-public: true
      x-flt-permission: "llm_gateway:providers:read"
      x-flt-stage: 1
      responses:
        "200":
          description: Список видов провайдеров
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/LlmGatewayProviderKind" }
  /api/v1/llm-gateway/provider-bindings:
    get:
      operationId: llm_gateway_listProviderBindings
      tags: [llm_gateway]
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      x-flt-permission: "llm_gateway:provider_bindings:read"
      x-flt-stage: 4
      parameters:
        - $ref: "../../_system/openapi-common.yaml#/components/parameters/Limit"
        - $ref: "../../_system/openapi-common.yaml#/components/parameters/Cursor"
        - { name: service, in: query, schema: { $ref: "#/components/schemas/LlmGatewayService" } }
      responses:
        "200":
          description: Подключения текущего пользователя
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LlmGatewayProviderBindingPage" }
        "401": { $ref: "../../_system/openapi-common.yaml#/components/responses/Error" }
    post:
      operationId: llm_gateway_createProviderBinding
      tags: [llm_gateway]
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      x-flt-permission: "llm_gateway:provider_bindings:create"
      x-flt-side-effect: true
      x-flt-stage: 4
      parameters:
        - $ref: "../../_system/openapi-common.yaml#/components/parameters/IdempotencyKey"
        - $ref: "../../_system/openapi-common.yaml#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LlmGatewayProviderBindingCreateRequest" }
      responses:
        "201":
          description: Подключение создано и проверено (SYS-08-R7); ключ в ответе не возвращается
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LlmGatewayProviderBindingResponse" }
        "401": { $ref: "../../_system/openapi-common.yaml#/components/responses/Error" }
        "403": { $ref: "../../_system/openapi-common.yaml#/components/responses/Error" }
        "409": { $ref: "../../_system/openapi-common.yaml#/components/responses/Error" }
        "422": { $ref: "../../_system/openapi-common.yaml#/components/responses/Error" }
  /api/v1/llm-gateway/provider-bindings/{provider_binding_id}:
    parameters:
      - { name: provider_binding_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: llm_gateway_getProviderBinding
      tags: [llm_gateway]
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      x-flt-permission: "llm_gateway:provider_bindings:read"
      x-flt-stage: 4
      responses:
        "200":
          description: Подключение
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LlmGatewayProviderBindingResponse" }
        "401": { $ref: "../../_system/openapi-common.yaml#/components/responses/Error" }
        "404": { $ref: "../../_system/openapi-common.yaml#/components/responses/Error" }
    patch:
      operationId: llm_gateway_patchProviderBinding
      tags: [llm_gateway]
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      x-flt-permission: "llm_gateway:provider_bindings:update"
      x-flt-stage: 4
      parameters:
        - $ref: "../../_system/openapi-common.yaml#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LlmGatewayProviderBindingPatchRequest" }
      responses:
        "200":
          description: Обновлённое подключение
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LlmGatewayProviderBindingResponse" }
        "401": { $ref: "../../_system/openapi-common.yaml#/components/responses/Error" }
        "404": { $ref: "../../_system/openapi-common.yaml#/components/responses/Error" }
        "409": { $ref: "../../_system/openapi-common.yaml#/components/responses/Error" }
        "422": { $ref: "../../_system/openapi-common.yaml#/components/responses/Error" }
    delete:
      operationId: llm_gateway_deleteProviderBinding
      tags: [llm_gateway]
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      x-flt-permission: "llm_gateway:provider_bindings:delete"
      x-flt-stage: 4
      parameters:
        - $ref: "../../_system/openapi-common.yaml#/components/parameters/CsrfToken"
      responses:
        "204": { description: Подключение и ключ удалены (SYS-08-R19) }
        "401": { $ref: "../../_system/openapi-common.yaml#/components/responses/Error" }
        "404": { $ref: "../../_system/openapi-common.yaml#/components/responses/Error" }
  /api/v1/llm-gateway/provider-bindings/{provider_binding_id}/test:
    parameters:
      - { name: provider_binding_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: llm_gateway_testProviderBinding
      tags: [llm_gateway]
      summary: Проверка подключения — единственный синхронный вызов провайдера по REST (SYS-03-R27, раздел 6; SYS-08-R7)
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      x-flt-permission: "llm_gateway:provider_bindings:test"
      x-flt-idempotency-exempt: true
      x-flt-sync-provider-call: true
      x-flt-stage: 1
      parameters:
        - $ref: "../../_system/openapi-common.yaml#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Результат проверки (таймаут 10 с)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LlmGatewayConnectionCheckResponse" }
        "401": { $ref: "../../_system/openapi-common.yaml#/components/responses/Error" }
        "404": { $ref: "../../_system/openapi-common.yaml#/components/responses/Error" }
        "429": { $ref: "../../_system/openapi-common.yaml#/components/responses/RateLimited" }
  /api/v1/llm-gateway/provider-bindings/{provider_binding_id}/models:
    parameters:
      - { name: provider_binding_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: llm_gateway_listBindingModels
      tags: [llm_gateway]
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      x-flt-permission: "llm_gateway:provider_bindings:read"
      x-flt-stage: 4
      responses:
        "200":
          description: Модели подключения и их возможности
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/LlmGatewayModelInfo" }
        "401": { $ref: "../../_system/openapi-common.yaml#/components/responses/Error" }
        "404": { $ref: "../../_system/openapi-common.yaml#/components/responses/Error" }
  /api/v1/llm-gateway/model-preferences:
    get:
      operationId: llm_gateway_listModelPreferences
      tags: [llm_gateway]
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      x-flt-permission: "llm_gateway:model_preferences:read"
      x-flt-stage: 4
      responses:
        "200":
          description: Выбор модели ученика по областям (SYS-08-R11)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LlmGatewayModelPreferences" }
        "401": { $ref: "../../_system/openapi-common.yaml#/components/responses/Error" }
    put:
      operationId: llm_gateway_putModelPreferences
      tags: [llm_gateway]
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      x-flt-permission: "llm_gateway:model_preferences:update"
      x-flt-stage: 4
      parameters:
        - $ref: "../../_system/openapi-common.yaml#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LlmGatewayModelPreferences" }
      responses:
        "200":
          description: Сохранённый выбор модели
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LlmGatewayModelPreferences" }
        "401": { $ref: "../../_system/openapi-common.yaml#/components/responses/Error" }
        "409": { $ref: "../../_system/openapi-common.yaml#/components/responses/Error" }
        "422": { $ref: "../../_system/openapi-common.yaml#/components/responses/Error" }
  /api/v1/llm-gateway/usage:
    get:
      operationId: llm_gateway_getUsage
      tags: [llm_gateway]
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      x-flt-permission: "llm_gateway:usage:read"
      x-flt-stage: 4
      parameters:
        - { name: period, in: query, required: true, schema: { type: string, enum: [day, week, month] } }
      responses:
        "200":
          description: Агрегаты расхода токенов (оценённые помечены)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LlmGatewayUsageSummary" }
        "401": { $ref: "../../_system/openapi-common.yaml#/components/responses/Error" }
components:
  securitySchemes:
    bearerAuth: { $ref: "../../_system/openapi-common.yaml#/components/securitySchemes/bearerAuth" }
    cookieAuth: { $ref: "../../_system/openapi-common.yaml#/components/securitySchemes/cookieAuth" }
  schemas:
    LlmGatewayService:
      type: string
      enum: [llm, speech]
    LlmGatewayJurisdiction:
      type: string
      enum: [ru, foreign]
    LlmGatewayErrorCode:
      type: string
      enum: [provider_auth, model_not_found, rate_limited, context_too_long, content_filtered, capability_unsupported, consent_required, platform_model_forbidden, platform_budget_exhausted, no_model_configured, agent_offline, provider_unavailable, instance_shutdown, timeout, internal]
    LlmGatewayProviderKind:
      type: object
      required: [kind, jurisdiction, auth_mode, display_name_key, default_base_url, stage]
      properties:
        kind: { type: string, examples: [openai_compatible, stub] }
        jurisdiction: { $ref: "#/components/schemas/LlmGatewayJurisdiction" }
        auth_mode: { type: string, enum: [api_key, agent, none] }
        display_name_key: { type: string, description: Ключ i18n названия вида }
        default_base_url: { type: [string, "null"] }
        stage: { type: integer, minimum: 1 }
    LlmGatewayProviderBindingStatus:
      type: string
      enum: [active, invalid, revoked]
    LlmGatewayProviderBindingResponse:
      type: object
      x-flt-entity: true
      required: [id, service, kind, name, base_url, default_model, has_api_key, api_key_last4, jurisdiction, status, last_checked_at, last_error_code, created_at, updated_at, version]
      properties:
        id: { type: string, format: uuid }
        service: { $ref: "#/components/schemas/LlmGatewayService" }
        kind: { type: string }
        name: { type: string, maxLength: 64 }
        base_url: { type: [string, "null"], format: uri }
        default_model: { type: [string, "null"] }
        agent_id: { type: [string, "null"], format: uuid }
        has_api_key: { type: boolean }
        api_key_last4: { type: [string, "null"], maxLength: 4 }
        jurisdiction: { $ref: "#/components/schemas/LlmGatewayJurisdiction" }
        status: { $ref: "#/components/schemas/LlmGatewayProviderBindingStatus" }
        last_checked_at: { type: [string, "null"], format: date-time }
        last_error_code: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/LlmGatewayErrorCode" }] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    LlmGatewayProviderBindingCreateRequest:
      type: object
      additionalProperties: false
      required: [service, kind, name]
      properties:
        service: { $ref: "#/components/schemas/LlmGatewayService" }
        kind: { type: string }
        name: { type: string, minLength: 1, maxLength: 64 }
        base_url: { type: string, format: uri }
        default_model: { type: string }
        api_key: { type: string, minLength: 1, maxLength: 512, writeOnly: true }
        extra_headers:
          type: object
          maxProperties: 5
          additionalProperties: { type: string }
        agent_id: { type: string, format: uuid }
    LlmGatewayProviderBindingPatchRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 64 }
        base_url: { type: string, format: uri }
        default_model: { type: [string, "null"] }
        api_key: { type: string, minLength: 1, maxLength: 512, writeOnly: true }
        extra_headers:
          type: object
          maxProperties: 5
          additionalProperties: { type: string }
    LlmGatewayProviderBindingPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/LlmGatewayProviderBindingResponse" }
        next_cursor: { type: [string, "null"] }
    LlmGatewayConnectionCheckResponse:
      type: object
      required: [ok, code, models_count, latency_ms]
      properties:
        ok: { type: boolean }
        code: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/LlmGatewayErrorCode" }] }
        models_count: { type: [integer, "null"], minimum: 0 }
        latency_ms: { type: integer, minimum: 0 }
    LlmGatewayModelCapabilities:
      type: object
      required: [streaming, tools, json_mode, vision, max_context_tokens, max_output_tokens]
      properties:
        streaming: { type: boolean }
        tools: { type: boolean }
        json_mode: { type: boolean }
        vision: { type: boolean }
        max_context_tokens: { type: [integer, "null"], minimum: 1 }
        max_output_tokens: { type: [integer, "null"], minimum: 1 }
    LlmGatewayModelInfo:
      type: object
      required: [llm_model, capabilities]
      properties:
        llm_model: { type: string }
        capabilities: { $ref: "#/components/schemas/LlmGatewayModelCapabilities" }
    LlmGatewayModelPreference:
      type: object
      required: [scope_type, scope_id, provider_binding_id, llm_model]
      properties:
        scope_type: { type: string, enum: [default, course] }
        scope_id: { type: [string, "null"], format: uuid }
        provider_binding_id: { type: string, format: uuid }
        llm_model: { type: string }
    LlmGatewayModelPreferences:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/LlmGatewayModelPreference" }
    LlmGatewayUsageSummary:
      type: object
      required: [period, prompt_tokens, completion_tokens, total_tokens, estimated_tokens, by_purpose]
      properties:
        period: { type: string, enum: [day, week, month] }
        prompt_tokens: { type: integer, minimum: 0 }
        completion_tokens: { type: integer, minimum: 0 }
        total_tokens: { type: integer, minimum: 0 }
        estimated_tokens: { type: integer, minimum: 0, description: Часть итога, полученная оценкой (SYS-08-R13) }
        by_purpose:
          type: array
          items:
            type: object
            required: [purpose, total_tokens]
            properties:
              purpose: { type: string }
              total_tokens: { type: integer, minimum: 0 }
